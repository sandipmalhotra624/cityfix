<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Issues · CityFix</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="gridbg"></div><div class="noise"></div>
<header class="topbar"><a class="brand" href="index.html"><div class="brand-logo">☁</div><div><div class="brand-name">CITY<span>FIX</span></div><span class="brand-sub">SMART CIVIC RESOLUTION</span></div></a><nav class="nav"><a href="index.html">Home</a><a href="report.html">Report</a><a href="track.html">Track</a><a href="admin.html">Authority</a><a href="database.html">Database</a><a href="analytics.html">Analytics</a></nav><div class="profile"><div class="avatar">S</div>Sandip</div></header>
<main class="container page"><div class="eyebrow">PUBLIC TRANSPARENCY</div><h1>Track issues</h1><p class="lead">Search any complaint and follow its journey from report to resolution.</p>
<div class="toolbar" style="margin-top:25px"><input id="search" placeholder="Search ID, issue, category or location..."><select id="filter"><option>All Status</option><option>Pending</option><option>In Progress</option><option>Resolved</option></select></div>
<div id="issues" class="grid2"></div></main>
<div id="modal" class="modal"><div id="modalContent" class="modal-box glass"></div></div>
<footer>CITYFIX · Smart City • Faster Resolution · Round 1 → Round 2 → Round 3</footer><div id="toast" class="toast"></div><script src="assets/app.js"></script><script>
function render(){let q=search.value.toLowerCase(),f=filter.value,a=getData().filter(x=>(f==="All Status"||x.status===f)&&JSON.stringify(x).toLowerCase().includes(q));issues.innerHTML=a.map(x=>`<article class="glass issue-card" onclick="openIssue('${x.id}')">${badge(x.status)}<h3>${x.title}</h3><div class="issue-meta">${x.id} · ${x.cat} · ${x.loc}<br>Reported by ${x.reporter} · ${x.date}</div><div class="divider"></div><p class="issue-desc">${x.desc}</p><span class="tiny">VIEW FULL TIMELINE →</span></article>`).join("")||`<div class="glass card-pad"><h3>No matching complaints</h3><p class="muted">Try another search or status filter.</p></div>`}search.oninput=filter.onchange=render;render();
</script></body></html>
